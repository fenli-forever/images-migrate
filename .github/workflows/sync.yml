name: sync images to harbor

on:
  push:
    branches: [master]
    paths:
      - 'images.yaml'
      - 'scripts/sync.sh'
      - '.github/workflows/sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: free disk space
        shell: bash
        run: |
          set -euxo pipefail

          echo "=== 清理前的磁盘空间 ==="
          df -h /
          docker system df || true

          echo "=== 开始删除 GitHub Runner 自带的大型无用软件 ==="
          unused_paths=(
            /usr/share/dotnet
            /usr/local/lib/android
            /opt/ghc
            /usr/local/.ghcup
            /usr/local/share/boost
            /usr/share/swift
            /usr/local/share/powershell
            /opt/az
          )
          if [[ -n "${AGENT_TOOLSDIRECTORY:-}" && "$AGENT_TOOLSDIRECTORY" == /opt/* ]]; then
            unused_paths+=("$AGENT_TOOLSDIRECTORY")
          fi
          sudo rm -rf -- "${unused_paths[@]}"

          echo "=== 清理 Docker 镜像、容器、卷和 BuildKit 缓存 ==="
          docker builder prune --all --force || true
          docker system prune -a -f --volumes || true
          sudo apt-get clean
          sudo rm -rf -- /var/cache/apt/archives/*

          echo "=== 清理后的磁盘空间 ==="
          df -h /
          docker system df || true

      - name: install sync tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends skopeo
          fi
          sudo apt-get clean
          sudo rm -rf -- /var/lib/apt/lists/* /var/cache/apt/archives/*

          yq --version
          skopeo --version

      - name: verify docker buildx
        run: docker buildx version

      - name: validate config
        run: bash scripts/sync.sh --dry-run

      - name: login to harbor
        run: |
          REGISTRY=$(yq -r '.target.registry' images.yaml)
          echo "::add-mask::${{ secrets.HARBOR_PASSWORD }}"
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login "$REGISTRY" \
            -u "${{ secrets.HARBOR_USERNAME }}" --password-stdin

      - name: sync images
        run: bash scripts/sync.sh

      - name: logout
        if: always()
        run: |
          REGISTRY=$(yq -r '.target.registry' images.yaml)
          docker logout "$REGISTRY" || true
