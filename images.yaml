# Docker 镜像同步配置
#
# target.registry  : Harbor 域名（不带 https://、不带尾斜杠）
# target.namespace : Harbor 项目名
# target.platforms : 多架构源镜像的平台白名单。仅这些平台会进目标 manifest list。
#                    不配置则保留源镜像的全部平台。单架构源不受此过滤影响。
# images[].source  : 源镜像（Docker Hub 等公网地址）
# images[].target  : 可选，覆盖目标路径段；缺省取 source 最后一段
#
# 最终目标地址 = <registry>/<namespace>/<target 或 source 末段>

target:
  registry: hub-pub.jdcloud.com
  namespace: mesh
  platforms:
    - linux/amd64
    - linux/arm64/v8

images:
  - source: gcr.io/kubebuilder/kube-rbac-proxy:v0.13.1
    target: kubebuilder/kube-rbac-proxy:v0.13.1
  - source: kserve/kserve-controller:v0.12.0
    target: kserve/kserve-controller:v0.12.0
  - source: kserve/modelmesh-controller:v0.11.2
    target: kserve/modelmesh-controller:v0.11.2
    
