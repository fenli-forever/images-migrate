# Docker 镜像同步配置
#
# target.registry  : Harbor 域名（不带 https://、不带尾斜杠）
# target.namespace : Harbor 项目名
# target.platforms : 多架构源镜像的平台白名单。仅这些平台会进目标 manifest list。
#                    不配置则保留源镜像的全部平台。单架构源不受此过滤影响。
# images[].source  : 源镜像（Docker Hub 等公网地址）
# images[].target  : 可选，覆盖目标路径段；缺省取 source 最后一段
#
# 最终目标地址 = <registry>/<namespace>/<target 或 source 末段>

target:
  registry: hub-pub.jdcloud.com
  namespace: mesh
  platforms:
    - linux/amd64
    - linux/arm64/v8

images:
  - source: kserve/rest-proxy:v0.11.2
    target: kserve/rest-proxy:v0.11.2
  - source: seldonio/mlserver:1.3.2
    target: seldonio/mlserver:1.3.2
  - source: kserve/modelmesh-runtime-adapter:v0.11.2
    target: kserve/modelmesh-runtime-adapter:v0.11.2
  - source: kserve/modelmesh:v0.11.2
    target: kserve/modelmesh:v0.11.2
  - source: openvino/model_server:2022.2
    target: openvino/model_server:2022.2
  - source: pytorch/torchserve:0.7.1-cpu
    target: pytorch/torchserve:0.7.1-cpu
  - source: nvcr.io/nvidia/tritonserver:23.04-py3
    target: nvidia/tritonserver:23.04-py3
  
    
    
    
    
